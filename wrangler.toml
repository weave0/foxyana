name = "foxyana"
compatibility_date = "2025-01-01"

# Custom domain — routes foxyana.com and www.foxyana.com to this worker
routes = [
    { pattern = "foxyana.com", custom_domain = true },
    { pattern = "www.foxyana.com", custom_domain = true },
]

# Static assets — served from repo root via wrangler deploy
[assets]
directory = "."
not_found_handling = "404-page"

[vars]
NODE_ENV = "production"

# Secrets (set via: wrangler secret put <NAME> --project-name foxyana)
# FORMSPREE_FORM_ID — Foxyana-specific Formspree endpoint (replace hardcoded ID in index.html)
